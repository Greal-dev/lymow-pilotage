# Calibration du pilotage Lymow — réglages NON secrets, lus à chaque commande.
# Ce fichier porte les incertitudes du protocole ; il ne peut assouplir aucun
# invariant de sécurité (plafonds, vitesses, arrêt, simulation par défaut).
# Une clé inconnue ou une valeur hors borne arrête l'outil avec une erreur.

# Sens de rotation : 1 = une vitesse angulaire positive fait tourner à GAUCHE
# (convention relevée en Bluetooth par ha-lymow). Passer à -1 si le premier
# essai « tourner 10 » fait tourner à droite.
signe_angulaire = 1

# Rapport déplacement réel / consigne (entre 0.5 et 2.0). Durée du mouvement =
# consigne / (vitesse × facteur). Exemple : « avancer 1 » ne parcourt que 0,8 m
# -> mettre 0.8. Le déplacement commandé (vitesse × durée) reste plafonné à
# 2 m et 180° : avec 0.5, « avancer 1.5 » est refusé (il commanderait 3 m).
facteur_distance = 1.0
# Constat du 2026-10-12 (journal réel, commande `lymow calibration-constat`) : 12 rotations de 45°
# commandées à 0,35 rad/s, 30 à 42° mesurés par le robot, rapport mesuré / commandé moyen 0,788
# (dispersion 0,077). Décision du propriétaire : facteur appliqué, arrondi à deux décimales.
# Conséquence : l'angle maximal demandable par ordre devient 142° (180° commandés au plus).
# Distance : rapport constaté 0,94 sur 11 pas à 0,25 m/s — NON appliqué, facteur laissé à 1.0.
facteur_angle = 0.79

# Disposition de la trame de pilotage manuel :
#   "mqtt" : PbInput{version, remoteControl (champ 10)}        (Lymow-HA)
#   "ble"  : la même avec le champ 7 = 2 en plus               (trame Bluetooth de ha-lymow)
variante_trame = "mqtt"

# Version de protocole annoncée : 49 (ha-lymow, application récente) ou 40 (Lymow-HA).
version_protocole = 49

# « plateau-haut » règle la hauteur de coupe à cette valeur (80 à 100 mm).
plateau_haut_mm = 100

# Disposition de l'ordre de hauteur de coupe :
#   "socle"    : avec userCtrl 50 (ha-lymow)
#   "lymow-ha" : sans userCtrl    (Lymow-HA)
variante_hauteur = "socle"

# Voie : écart entre les deux chenilles, en mètres. ESTIMATION, À CALIBRER (aucune des sources ne la donne).
# Elle sert aux arcs (`lymow arc`, flèches diagonales) : la chenille intérieure garde au moins 20 % de la
# vitesse de l'ordre, pour virer sans pivoter sur place. Une voie plus grande adoucit les virages.
voie_m = 0.45
